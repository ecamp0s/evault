# eVault de un comando. Ver ADR-012 y el issue #155.
#
#     docker compose up --build
#
# Levanta la SPA, la API y la base de datos, y deja la aplicación lista para
# registrar un usuario sin ningún paso previo. Los valores por defecto están en
# .env.example: para un clon limpio sirven tal cual.

# NO project name here, and that absence is the fix for #276.
#
# A fixed `name:` is the same in every clone, because it comes from the file rather
# than from the directory. So a second clone on the same machine — the obvious thing
# to do when rehearsing a restore, which is what #266 needed — silently adopted the
# first one's containers and volumes. `docker compose down -v` from it would have
# deleted the database holding 370 real passwords, and nothing would have warned.
#
# Without it Compose derives the name from the directory, so two clones in two
# directories are two deployments on their own, with no configuration required. That
# is the property worth having: the protection cannot be forgotten.
#
# In practice nothing moves. `git clone` produces a directory named evault, and the
# personal instance already lives in ~/apps/evault, so both keep the project name
# they had and their volumes stay where they are.
#
# THE ONE CASE THAT DOES MOVE, and it looks far worse than it is: a clone in a
# directory named something else. Its project name changes, so Compose creates EMPTY
# volumes and the vault comes up with nothing in it. The old volumes are still
# there — nothing is lost — and either renaming them or exporting
# COMPOSE_PROJECT_NAME with the old name brings the data back. DEPLOYMENT.md §7 has
# the check to run before updating.

services:
  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-evault}
      MYSQL_USER: ${DB_USERNAME:-evault}
      MYSQL_PASSWORD: ${DB_PASSWORD:-evault}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      # El estado vive fuera del contenedor, que es lineamiento de ADR-012:
      # destruir y recrear el contenedor no puede costar los datos.
      - db-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${DB_ROOT_PASSWORD:-root}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: http://${APP_HOST:-app.evault.localhost}

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-evault}
      DB_USERNAME: ${DB_USERNAME:-evault}
      DB_PASSWORD: ${DB_PASSWORD:-evault}

      APP_HOST: ${APP_HOST:-app.evault.localhost}
    volumes:
      # El código desde el clon, no copiado a la imagen: un cambio en api/ se ve
      # sin reconstruir. El mismo montaje lo lee Caddy en solo lectura.
      - ./api:/var/www/html
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      # Sin `args`, desde ADR-016: el build ya no hornea la URL de la API, así que
      # el mismo artefacto sirve a cualquier hostname y no hay nada que pasarle.
    depends_on:
      - api
    environment:
      APP_HOST: ${APP_HOST:-app.evault.localhost}
    ports:
      - '${HTTP_PORT:-80}:80'
    volumes:
      - ./api:/var/www/html:ro
    restart: unless-stopped

volumes:
  db-data:
