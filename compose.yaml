# eVault de un comando. Ver ADR-012 y el issue #155.
#
#     docker compose up --build
#
# Levanta la SPA, la API y la base de datos, y deja la aplicación lista para
# registrar un usuario sin ningún paso previo. Los valores por defecto están en
# .env.example: para un clon limpio sirven tal cual.

name: evault

services:
  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-evault}
      MYSQL_USER: ${DB_USERNAME:-evault}
      MYSQL_PASSWORD: ${DB_PASSWORD:-evault}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      # El estado vive fuera del contenedor, que es lineamiento de ADR-012:
      # destruir y recrear el contenedor no puede costar los datos.
      - db-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${DB_ROOT_PASSWORD:-root}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: http://${API_HOST:-api.evault.localhost}

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-evault}
      DB_USERNAME: ${DB_USERNAME:-evault}
      DB_PASSWORD: ${DB_PASSWORD:-evault}

      # El entrypoint compone con esto el origen que CORS compara, porque la regla
      # —el puerto se omite si es el estándar— no se puede expresar aquí.
      APP_HOST: ${APP_HOST:-app.evault.localhost}
      HTTP_PORT: ${HTTP_PORT:-80}
    volumes:
      # El código desde el clon, no copiado a la imagen: un cambio en api/ se ve
      # sin reconstruir. El mismo montaje lo lee Caddy en solo lectura.
      - ./api:/var/www/html
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        # En tiempo de build y no de ejecución, a propósito: Vite hornea la URL de
        # la API dentro del JavaScript y de la CSP. Cambiar cualquiera de las dos
        # exige `docker compose build web`.
        API_HOST: ${API_HOST:-api.evault.localhost}
        HTTP_PORT: ${HTTP_PORT:-80}
    depends_on:
      - api
    environment:
      APP_HOST: ${APP_HOST:-app.evault.localhost}
      API_HOST: ${API_HOST:-api.evault.localhost}
    ports:
      - '${HTTP_PORT:-80}:80'
    volumes:
      - ./api:/var/www/html:ro
    restart: unless-stopped

volumes:
  db-data:
