<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>eVault</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main>
      <h1>eVault</h1>

      <section id="loading">
        <p class="muted">Comprobando…</p>
      </section>

      <form id="locked" hidden>
        <label for="email">Correo de tu cuenta</label>
        <input id="email" type="email" autocomplete="username" required />
        <button id="unlock" type="submit">Desbloquear con passkey</button>
        <p class="muted">
          La contraseña maestra se escribe en la web, que es también donde se añade el passkey.
        </p>
      </form>

      <section id="unlocked" hidden>
        <div class="bar">
          <span class="muted"><strong id="account"></strong></span>
          <button id="lock" type="button" class="secondary">Bloquear</button>
        </div>
        <label for="search">Buscar en la vault</label>
        <input id="search" type="search" autocomplete="off" spellcheck="false" />
        <p id="summary" class="muted"></p>
        <ul id="entries"></ul>
        <details id="generator">
          <summary>Generar una contraseña</summary>
          <output id="generated" class="generated" aria-live="polite"></output>
          <div class="row">
            <label for="generator-length">Longitud</label>
            <input id="generator-length" type="number" inputmode="numeric" />
            <label class="check"><input id="generator-symbols" type="checkbox" checked /> Símbolos</label>
          </div>
          <div class="row">
            <button id="generator-again" type="button" class="secondary">Otra</button>
            <button id="generator-copy" type="button">Copiar</button>
          </div>
          <p class="muted">No se guarda en la vault: para guardarla, créala en la web.</p>
        </details>
        <p class="muted">Se bloquea sola tras <span id="limit"></span> minutos sin usarla.</p>
      </section>

      <p id="message" role="status"></p>
      <p class="muted instance">Instancia: <span id="instance"></span></p>
    </main>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
