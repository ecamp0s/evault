name: status

# Mantiene docs/planning/STATUS.md al día sin intervención manual.
#
# El estado de un issue solo pasa a Done después de mergear su PR, así que el
# STATUS.md que viaja dentro de un PR nunca puede reflejar el cierre del issue
# que ese mismo PR cierra. Este workflow cierra ese desfase regenerándolo
# después del merge.
# Qué cuenta como push a master, porque no es evidente y ya costó una
# investigación (issue #63):
#
# Mergear un pull request ES un push a master. Lo hace GitHub en el servidor, no
# el desarrollador en su máquina, así que no aparece en el historial de comandos
# de nadie y es fácil buscarlo donde no está. El 31 de julio de 2026 esto se
# tomó por un disparador de más: se vio una ejecución a las 18:11:06 UTC sin
# recordar que el PR #49 se había mergeado a las 18:11:04, dos segundos antes.
# Comprobado después contra la API: en cien ejecuciones, la rama siempre ha sido
# master. El filtro hace exactamente lo que dice.
#
# Consecuencia práctica, y es la que importa al trabajar: cada merge deja un
# commit del bot en master, así que cualquier rama viva que toque STATUS.md
# acabará en conflicto. No es un fallo de este workflow sino la contrapartida de
# generar el documento; el procedimiento para resolverlo está en docs/GUIDE.md.
on:
  push:
    branches: [master]
  # Los cambios de prioridad o de estado en el Project no van acompañados de
  # ningún push, así que hace falta además una ejecución periódica y otra manual.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: status-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    # The `name:` is what a person reads in the Actions interface and the job id is
    # an identifier; both are in English since #478, because neither is text the
    # application's user ever sees. This comment used to say the opposite — that
    # `name:` went in Spanish — while three of the four workflows were already in
    # English, which is the kind of claim a document keeps making long after it
    # stopped being true.
    #
    # Before #195 there was no `name:` at all and the interface showed the id, so
    # renaming the id alone would have changed the visible text.
    name: Regenerate STATUS.md
    runs-on: ubuntu-latest
    # El commit del propio job lleva [skip ci], pero la condición es una segunda
    # barrera contra el bucle por si alguien la quita del mensaje.
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
      issues: read
    steps:
      - uses: actions/checkout@v7

      - name: Regenerate STATUS.md
        env:
          # El GITHUB_TOKEN por defecto no puede leer Projects v2, así que hace
          # falta un PAT con scope read:project en el secret STATUS_TOKEN. Si no
          # está, el modo estricto hace fallar el job en vez de commitear un
          # STATUS.md degradado sin prioridades.
          GH_TOKEN: ${{ secrets.STATUS_TOKEN || secrets.GITHUB_TOKEN }}
          EVAULT_STATUS_ESTRICTO: "1"
        run: ./scripts/status.sh

      - name: Commit if it changed
        run: |
          if git diff --quiet -- docs/planning/STATUS.md; then
            echo "STATUS.md ya estaba al día, no hay nada que commitear"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/planning/STATUS.md
          git commit -m "docs: regenerar STATUS.md [skip ci]"
          git push
