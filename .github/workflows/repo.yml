name: repository

# Este workflow existe por el issue #62, y su razón no es que faltaran checks:
# es que LA AUSENCIA DE UN CHECK NO SIGNIFICABA NADA. Un PR de solo documentación
# no disparaba ningún job, y un PR en conflicto tampoco —GitHub no ejecuta los
# workflows de un PR que no puede mergear—, así que los dos síntomas eran el
# mismo y había que adivinar cuál era.
#
# Por eso sus dos jobs se ejecutan SIEMPRE y sin filtro de paths: son baratos, y
# lo que aportan es que un PR sin ellos sea una anomalía visible.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  documentation:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      # fetch-depth: 0 y no el clon superficial por defecto. Con profundidad 1 no
      # hay antepasado común entre la rama y master, y `git diff base...HEAD` muere
      # con «no merge base». Se descubrió en el primer PR de este workflow, no
      # leyéndolo: en local nunca falta historia.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # El cuerpo del PR va por fichero y no interpolado en el script: lo escribe
      # cualquiera, y una comilla suelta ahí es una inyección en la shell.
      - name: Prepare the PR context
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          printf '%s' "$PR_BODY" > /tmp/pr-body.txt
          git diff --name-only "origin/${BASE_REF}...HEAD" > /tmp/changed.txt

      - name: Check the documentation
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./scripts/check-docs.py --pr-body /tmp/pr-body.txt --changed-files /tmp/changed.txt
          else
            ./scripts/check-docs.py
          fi

  tooling:
    name: Tooling
    runs-on: ubuntu-latest

    steps:
      # Con la historia entera: el censo compara contra la base del PR, y con el
      # checkout superficial por defecto no habría con qué comparar.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Node hace falta para los tests de scripts/ui-text.mjs, que vuelca el texto
      # visible con el AST real de TypeScript — el que vive en web/node_modules.
      # Sin él NO MIDE, y entonces falla en vez de devolver cero, que es la
      # lección de #184.
      #
      # PHP ya no hace falta: lo pedía el extractor de identificadores, que #323
      # retiró junto con el comprobador al que servía.
      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the frontend dependencies
        working-directory: web
        run: npm ci

      - name: Tooling tests
        run: python3 -m unittest discover -s scripts/tests -v

      # CON --all DESDE #323, Y ESE CAMBIO ES EL FINAL DE #290.
      #
      # Hasta aquí miraba solo las líneas que un PR AÑADE, y era deliberado:
      # quedaban 3.993 líneas de comentario en español esperando a la conversión,
      # así que mirar el árbol lo habría dejado rojo para siempre — y un check que
      # nace en rojo se acaba ignorando entero, que es la lección de #62.
      #
      # Las seis capas las convirtieron y este PR retira los cuatro ficheros que
      # guardaban las 158 últimas, así que el árbol está limpio y el check entra en
      # verde. Desde ahora la regla de idioma se comprueba entera y no solo hacia
      # delante, que es lo que sustituye a check-identifiers.py.
      - name: Comments and test names in English
        run: ./scripts/check-comment-language.py --all

      # El cuerpo del PR va por fichero y no interpolado, igual que arriba: lo escribe
      # cualquiera, y una comilla suelta ahí es una inyección en la shell. Se repite
      # aquí porque cada job corre en su máquina y no comparte /tmp con el de docs.
      - name: Prepare the PR body
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > /tmp/pr-body.txt

      # La otra mitad, y vigila el error contrario: el check de arriba marca prosa
      # española, así que un comentario BORRADO en vez de traducido se lleva su propio
      # hallazgo y deja el check en verde. Sobre las 3.993 líneas de #290, repartidas
      # en seis PR, la única red existente premiaría el peor resultado posible.
      #
      # Sigue haciendo falta con la conversión terminada: lo que vigila no es la
      # traducción sino que nadie borre comentario, y eso no caduca.
      #
      # Se justifica con una línea «Censo: <motivo>» en el cuerpo del PR, porque a
      # veces la pérdida es a propósito — #323 borró cinco ficheros enteros.
      # La base del censo depende del evento, y el disparo A MANO no tenía ninguna
      # —#364—. `github.event.before` es el commit anterior de un PUSH; en
      # `workflow_dispatch` llega vacío, y `git ls-tree -r --name-only ""` no es un
      # objeto válido, así que el paso reventaba con un error que no hablaba de nada
      # reconocible. Era una capacidad DECLARADA que nadie había ejercitado, y el día
      # que el disparo por pull_request se cayó era la única vía que quedaba.
      #
      # Se resuelve eligiendo la base en tres casos y no en dos, y comprobando que
      # existe antes de usarla: un push cuyo `before` sea el commit nulo —una rama
      # recién creada— tiene el mismo problema y tampoco lo tenía cubierto.
      - name: Comment census
        run: |
          set -euo pipefail

          case "${{ github.event_name }}" in
            pull_request)
              base="origin/${{ github.base_ref }}"
              ;;
            push)
              base="${{ github.event.before }}"
              ;;
            *)
              base="HEAD~1"
              ;;
          esac

          # Un `before` de todo ceros es lo que GitHub manda al crear una rama, y no
          # es un commit: no hay nada anterior con lo que comparar.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD~1"
          fi

          if ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
            echo "El censo no tiene con qué comparar: '$base' no existe. Se omite."
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./scripts/check-comment-language.py --census --base "$base" --pr-body /tmp/pr-body.txt
          else
            ./scripts/check-comment-language.py --census --base "$base"
          fi
