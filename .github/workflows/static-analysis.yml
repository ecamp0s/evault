name: static-analysis

# Sin filtro de paths en el trigger, a propósito. Ver el comentario equivalente en
# frontend.yml: el filtrado vive en el job «cambios» para que los jobs se salten
# en vez de no existir, y así siempre reporten estado.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: api

jobs:
  cambios:
    name: Detectar cambios
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filtro.outputs.api }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: filtro
        name: Ver si el cambio toca el backend
        working-directory: .
        env:
          EVENTO: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ANTES: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # Ante cualquier duda se ejecuta todo. Un job de más cuesta un minuto;
          # uno de menos deja pasar un PR sin comprobar y en verde.
          ejecutar_todo() {
            echo "Motivo: $1"
            echo "api=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          case "$EVENTO" in
            pull_request) base="$BASE_SHA" ;;
            push) base="$ANTES" ;;
            *) ejecutar_todo "evento $EVENTO, sin rango de comparación" ;;
          esac

          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            ejecutar_todo "no hay commit base (rama nueva o force push)"
          fi

          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            ejecutar_todo "el commit base $base no está en el clon"
          fi

          ficheros="$(git diff --name-only "$base" HEAD)"
          echo "Ficheros cambiados:"
          echo "$ficheros"

          if echo "$ficheros" | grep -qE '^(api/|\.github/workflows/static-analysis\.yml$)'; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
          fi

  larastan:
    name: Larastan
    needs: cambios
    if: needs.cambios.outputs.api == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Configurar PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Cachear dependencias de Composer
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-php8.4-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.4-

      - name: Instalar dependencias
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Análisis estático
        run: composer analyse

  pest:
    name: Pest
    needs: cambios
    if: needs.cambios.outputs.api == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Configurar PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Cachear dependencias de Composer
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-php8.4-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.4-

      - name: Instalar dependencias
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Tests
        run: php artisan test
